[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "case-galaxies"
version = "0.1.0"
description = "Pipeline rastreável para previsão de desempenho de criativos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
evaluation = ["matplotlib>=3.9,<4"]
mcp = ["mcp[cli]>=2,<3"]
explain = ["shap>=0.46,<1"]
boosting = [
  "catboost>=1.2,<2",
  "lightgbm>=4,<5",
  "xgboost>=2,<4",
]
local-vlm = [
  "accelerate>=1.10,<2",
  "av>=16,<20",
  "bitsandbytes>=0.50,<0.51",
  "num2words>=0.5,<1",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "torch>=2.8,<3",
  "transformers>=5.17,<6",
]
agent = [
  "langgraph>=1.2,<2",
]
twelvelabs = [
  "twelvelabs>=1.3,<2",
]
youtube-media = [
  "imageio-ffmpeg>=0.6,<1",
  "yt-dlp>=2025.1.15,<2027",
]
embeddings = [
  "open-clip-torch>=3.2,<4",
  "pillow>=11,<13",
  "pyarrow>=18,<25",
  "sentence-transformers>=3.4,<6",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
